<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeAnchor｜共同LPの案件受付</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <img
            src="css/img/logo_lp_test.png"
            alt="PrimeAnchor"
            class="logo"
        >
        <span>共同LPの案件受付</span>
    </header>

    <main class="workspace">

        <!-- 左：LPのプレビュー -->
        <section class="publish-area">
            <p class="section-label">まずは、顧客との接点をつくる</p>
            <h1>共同LPを、<br>公開しよう。</h1>

            <div id="preview" class="preview">
                <div class="preview-bar">
                    <span class="window-dots">● ● ●</span>
                    <span id="preview-status">公開前</span>
                </div>

                <div class="preview-body">
                    <img
                        src="css/img/logo_lp_test.png"
                        alt="PrimeAnchor"
                        class="preview-logo"
                    >

                    <p class="preview-copy">
                        パートナーの<br>
                        顧客接点を、<br>
                        商談のきっかけに。
                    </p>

                    <div class="preview-link">サービスについて相談する →</div>

                    <div class="preview-lines">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <span id="published-stamp" class="published-stamp">
                    公開中
                </span>
            </div>

            <button id="publish" class="primary-button" type="button">
                LPを公開する <span>↗</span>
            </button>

            <p id="status" class="status" role="status" aria-live="polite">
                公開の準備ができています
            </p>
        </section>

        <!-- 右：問い合わせ受付 -->
        <section class="reception-area">
            <div class="reception-heading">
                <h2>問い合わせ受付</h2>
                <span id="count" class="count">0件</span>
            </div>

            <!-- 問い合わせが来るまでの画面 -->
            <div id="waiting" class="waiting">
                <div class="mailbox" aria-hidden="true">〒</div>
                <p id="waiting-text">まだ問い合わせはありません</p>
                <span id="waiting-dots" style="display: none;">● ● ●</span>
            </div>

            <!-- 問い合わせ -->
            <div id="inquiry" style="display: none;">
                <div class="arrival">
                    <span class="envelope" aria-hidden="true">✉</span>
                    <span>問い合わせが届きました</span>
                </div>

                <p class="company-label">お問い合わせ企業</p>
                <h3 id="company"></h3>
                <p class="source">共同LPからのご相談</p>

                <button id="check" class="check-button" type="button">
                    バッティングを確認する <span>→</span>
                </button>
            </div>

            <!-- 照合中 -->
            <div id="checking" class="checking" style="display: none;"
                 role="status">
                <div class="scan-track">
                    <span></span>
                </div>
                <p>顧客情報を照合しています…</p>
            </div>

            <!-- 判定結果 -->
            <div id="result" class="result" style="display: none;"
                 aria-live="polite">
                <div id="result-symbol" class="result-symbol"></div>

                <div>
                    <p id="result-title" class="result-title"></p>
                    <p id="result-message" class="result-message"></p>
                </div>
            </div>

            <button id="reset" class="reset-button"
                    type="button" style="display: none;">
                もう一度試す ↻
            </button>
        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/dr.js"></script>
</body>
</html>
